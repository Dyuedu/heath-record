# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/health_record
spring.datasource.username=postgres
spring.datasource.password=giang2004
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

#file size upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JPA and Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Enable DevTools for hot reloading
spring.devtools.livereload.enabled=true
spring.devtools.restart.enabled=true

# Logging Configuration
logging.level.org.springframework.web=debug
logging.level.root=info

# Mail configuration for OTP sending
# Set MAIL_ENABLED=true and provide SMTP credentials in env to send real emails.
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.debug-error=${MAIL_DEBUG_ERROR:true}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

